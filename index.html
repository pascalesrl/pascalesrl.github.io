<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <meta name="description" content="Il sito è attualmente in costruzione. Torna presto a trovarci.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            background:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.25), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.20), transparent 35%),
                #080b14;

            overflow: hidden;
        }

        /* Background decoration */

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #6366f1;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #a855f7;
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }

        .container {
            position: relative;
            z-index: 1;

            width: min(90%, 700px);
            padding: 60px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 24px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.35);
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 36px;

            background: linear-gradient(135deg,
                    #6366f1,
                    #a855f7);

            box-shadow:
                0 10px 40px rgba(99, 102, 241, 0.35);
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 700;
            letter-spacing: -2px;

            margin-bottom: 20px;

            background: linear-gradient(135deg,
                    #ffffff,
                    #c7d2fe);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.15rem;
            line-height: 1.7;

            color: rgba(255, 255, 255, 0.65);

            max-width: 500px;
            margin: 0 auto 35px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 10px 18px;

            border-radius: 999px;

            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #a78bfa;

            box-shadow:
                0 0 0 5px rgba(167, 139, 250, 0.10);

            animation: pulse 2s infinite;
        }

        .footer {
            margin-top: 45px;

            font-size: 0.8rem;

            color: rgba(255, 255, 255, 0.35);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -20px);
            }
        }

        @media (max-width: 600px) {

            .container {
                padding: 45px 25px;
            }

            .icon {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">
            🚀
        </div>

        <h1>Coming Soon</h1>

        <p class="subtitle">
            Stiamo lavorando a qualcosa di nuovo.
            Il sito è attualmente in costruzione e
            sarà disponibile molto presto.
        </p>

        <div class="status">
            <span class="dot"></span>
            Sito in costruzione
        </div>

        <div class="footer">
            © 2026 — Tutti i diritti riservati
        </div>

    </main>

</body>

</html>
